<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trading Performance Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; }
html,body{margin:0;padding:0;background:#080808;}
body {
  font-family: 'Inter', sans-serif;
  color: #f5f5f7;
  min-height: 100vh;
}
h1,h3,.stat-value,.brand-title,.btn,.pill strong { font-family: 'Space Grotesk', sans-serif; }

.app-shell { display: flex; position: relative; min-height:100vh; }

/* Sidebar */
.sidebar {
  width: 234px; background: #0c0c0e; border-right: 1px solid #1d1d21;
  display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
  flex-shrink: 0; transition: width 0.2s ease, left .25s ease; z-index: 40;
}
.sidebar-collapsed { width: 72px; }
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid #1a1a1e; position: relative; }
.brand-avatar-wrap { position:relative; flex-shrink:0; cursor:pointer; }
.brand-avatar-wrap img, .brand-avatar-placeholder { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border:2px solid #ff3d7a; display:block; }
.brand-avatar-placeholder { background: linear-gradient(135deg, #ff3d7a, #b6206f); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
.brand-text { min-width:0; }
.brand-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; line-height: 1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-sub { font-size: 10.5px; color: #6b6b73; margin-top: 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-mobile-close { display: none; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px;
  background: transparent; border: none; color: #9a9aa2; font-size: 13.5px; cursor: pointer; text-align: left;
  transition: background .18s ease, color .18s ease, transform .18s ease; position:relative; width:100%;
}
.nav-item:hover { background: #17171b; color: #f5f5f7; transform: translateX(3px); }
.nav-item svg{ flex-shrink:0; width:17px; height:17px; transition: transform .18s ease; }
.nav-item:hover svg{ transform: scale(1.12); }
.nav-item-active { background: rgba(255,61,122,0.12); color: #ff3d7a; }
.nav-item-active::before{ content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:3px; border-radius:3px; background:#ff3d7a; animation: barIn .25s ease; }
@keyframes barIn{ from{ transform: scaleY(0);} to{ transform: scaleY(1);} }
.sidebar-collapse-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px; padding: 9px; border-radius: 9px; background: #131316; border: 1px solid #1f1f24; color: #9a9aa2; font-size: 12px; cursor: pointer; transition:.15s; }
.sidebar-collapse-btn:hover{ background:#1c1c21; }
.sidebar-scrim { display: none; }

/* Main */
.app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 26px; border-bottom: 1px solid #1a1a1e; position: sticky; top: 0; background: rgba(8,8,8,0.85); backdrop-filter: blur(10px); z-index: 20; }
.topbar-menu { display: none; }
.topbar-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
.topbar-trader { margin-left: auto; font-size: 12.5px; color: #6b6b73; }
.app-content { padding: 24px 26px 60px; }
.page { display: flex; flex-direction: column; gap: 20px; max-width: 1400px; animation: pageIn .35s ease; }
@keyframes pageIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-header h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.page-sub { color: #8f8f97; font-size: 13.5px; margin: 0; }
.header-pills { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { background: #131316; border: 1px solid #1f1f24; border-radius: 12px; padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 88px; transition:.2s; }
.pill:hover{ border-color:#33333a; }
.pill span { font-size: 10.5px; color: #6b6b73; }
.pill strong { font-size: 14px; }
.pill-green strong { color: #22c55e; } .pill-red strong { color: #ef4444; }

/* Stat grid */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.stat-card {
  background: linear-gradient(180deg, #141417 0%, #101012 100%); border: 1px solid #1f1f24; border-radius: 16px; padding: 16px 18px;
  opacity: 0; animation: cardIn 0.5s ease forwards; transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; cursor:default;
}
.stat-card:hover{ transform: translateY(-4px) scale(1.015); box-shadow: 0 14px 34px rgba(255,61,122,0.14); border-color:#33333a; }
@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.stat-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.stat-icon { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; transition: transform .2s ease; }
.stat-card:hover .stat-icon{ transform: scale(1.12) rotate(-4deg); }
.stat-label { font-size: 11.5px; color: #8f8f97; }
.stat-value { font-size: 21px; font-weight: 600; }
.stat-sub { font-size: 11px; color: #6b6b73; margin-top: 4px; }

/* Cards */
.card { background: #101012; border: 1px solid #1c1c21; border-radius: 16px; padding: 18px 20px; transition: border-color .2s ease; }
.card:hover{ border-color:#26262c; }
.chart-card { min-width: 0; }
.chart-wrap{ position:relative; height:230px; }
.chart-wrap-sm{ position:relative; height:190px; }
.chart-legend-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:#9a9aa2; }
.chart-legend-row span.dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
.chart-nodata{ display:flex; align-items:center; justify-content:center; height:100%; color:#4b4b52; font-size:12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: #d8d8dc; margin-bottom: 12px; }
.section-title svg{ width:15px; height:15px; }

/* Tables */
.table-scroll { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
.data-table th { text-align: left; color: #6b6b73; font-weight: 500; padding: 8px 10px; border-bottom: 1px solid #1c1c21; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
.data-table td { padding: 10px; border-bottom: 1px solid #16161a; white-space: nowrap; }
.data-table tbody tr{ transition: background .15s ease; }
.data-table tbody tr:hover { background: #131316; }
.clickable { cursor: pointer; }
.text-green { color: #22c55e; font-weight: 600; } .text-red { color: #ef4444; font-weight: 600; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #1a1a1e; color: #9a9aa2; }
.badge-green { background: rgba(34,197,94,0.14); color: #22c55e; }
.badge-red { background: rgba(239,68,68,0.14); color: #ef4444; }
.badge-yellow { background: rgba(234,179,8,0.14); color: #eab308; }
.badge-neutral { background: #1a1a1e; color: #9a9aa2; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: transform 0.12s ease, opacity 0.15s ease, box-shadow .2s ease; }
.btn:hover{ box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, #ff3d7a, #d92a68); color: #fff; }
.btn-primary:hover { opacity: 0.92; }
.btn-ghost { background: #16161a; border-color: #26262c; color: #e5e5e8; }
.btn-ghost:hover { background: #1c1c21; }
.btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.3); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.icon-btn { background: transparent; border: none; color: #9a9aa2; cursor: pointer; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition:.15s; }
.icon-btn:hover { background: #1a1a1e; color: #f5f5f7; transform: scale(1.08); }
.icon-btn-xs { background: transparent; border: none; color: #9a9aa2; cursor: pointer; padding: 4px; border-radius: 6px; display: inline-flex; transition:.15s; }
.icon-btn-xs:hover { background: #1a1a1e; transform: scale(1.12); }
.row-actions { display: flex; gap: 4px; }

/* Toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar select { background: #131316; border: 1px solid #26262c; color: #e5e5e8; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
.search-box { display: flex; align-items: center; gap: 8px; background: #131316; border: 1px solid #26262c; border-radius: 10px; padding: 8px 12px; flex: 1; min-width: 180px; color: #6b6b73; }
.search-box input { background: transparent; border: none; outline: none; color: #f5f5f7; font-size: 13px; width: 100%; }
.search-box svg{ width:15px; height:15px; flex-shrink:0; }
.be-pl-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(234,179,8,.16);border:1px solid rgba(234,179,8,.48);color:#facc15;border-radius:999px;padding:4px 9px;font-weight:700;font-size:12px;white-space:nowrap}
.bt-search-actions{display:flex;gap:8px;flex:1;min-width:240px}.bt-search-actions .search-box{flex:1}

.pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; font-size: 12.5px; color: #8f8f97; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #111114; border: 1px solid #232328; border-radius: 18px; width: 480px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; animation: modalIn 0.2s ease; }
.modal-wide { width: 700px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #1c1c21; }
.modal-header h3 { margin: 0; font-size: 15px; font-family: 'Space Grotesk', sans-serif; }
.modal-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }

.confirm-box { background: #111114; border: 1px solid #232328; border-radius: 16px; padding: 24px; width: 320px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: modalIn .2s ease; }
.confirm-box p { margin: 0; font-size: 13.5px; color: #d8d8dc; }
.confirm-actions { display: flex; gap: 10px; width: 100%; }
.confirm-actions .btn { flex: 1; justify-content: center; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.field-label { font-size: 11.5px; color: #8f8f97; font-weight: 500; }
.field input, .field select, .field textarea {
  background: #16161a; border: 1px solid #26262c; border-radius: 9px; padding: 9px 11px; color: #f5f5f7; font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: #ff3d7a; }
.field textarea { resize: vertical; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-row .field { min-width: 140px; }

.checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.checkbox-pill { display: flex; align-items: center; gap: 7px; background: #16161a; border: 1px solid #26262c; border-radius: 9px; padding: 8px 10px; font-size: 12px; cursor: pointer; transition:.15s; }
.checkbox-pill:hover{ border-color:#3a3a42; }

.image-drop { border: 1.5px dashed #2c2c32; border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; background: #131316; transition:.15s; }
.image-drop:hover{ border-color:#ff3d7a; }
.image-drop-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #6b6b73; font-size: 12.5px; }
.image-drop-preview img { max-width: 100%; max-height: 200px; border-radius: 10px; object-fit: contain; }
.image-drop-preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }

/* Toast */
.toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.toast { display: flex; align-items: center; gap: 8px; background: #16161a; border: 1px solid #26262c; padding: 10px 16px; border-radius: 10px; font-size: 12.5px; color: #f5f5f7; animation: toastIn 0.25s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.toast-success svg { color: #22c55e; width:16px; height:16px; } .toast-danger svg { color: #ef4444; width:16px; height:16px; }

.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 6px; }
.detail-label { display: block; font-size: 10.5px; color: #6b6b73; margin-bottom: 4px; }
.detail-image { width: 100%; border-radius: 12px; margin: 6px 0; }
.detail-text { font-size: 12.5px; color: #c5c5cb; margin: 4px 0; }

.risk-banner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; }
.risk-banner svg{ width:18px; height:18px; }
.risk-safe { background: rgba(34,197,94,0.12); color: #22c55e; }
.risk-warning { background: rgba(234,179,8,0.12); color: #eab308; }
.risk-exceeded { background: rgba(239,68,68,0.12); color: #ef4444; }

.psych-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.psych-card { background: #131316; border: 1px solid #1f1f24; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition:.2s; }
.psych-card:hover{ border-color:#33333a; }
.psych-emotion { font-size: 13px; font-weight: 600; }
.psych-bar-track { height: 6px; border-radius: 4px; background: #1f1f24; overflow: hidden; }
.psych-bar-fill { height: 100%; border-radius: 4px; transition: width 0.7s ease; }
.psych-pct { font-size: 11px; color: #8f8f97; }

.best-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.best-card { background: #101012; border: 1px solid #1c1c21; border-radius: 16px; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
.best-card:hover{ transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.4); }
.best-card img { width: 100%; height: 150px; object-fit: cover; }
.best-card-noimg { width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; background: #16161a; color: #4b4b52; }
.best-card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.best-card-top { display: flex; align-items: center; justify-content: space-between; }
.best-card-meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: #8f8f97; flex-wrap: wrap; }
.best-card-stats { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
.best-card-desc { font-size: 12px; color: #9a9aa2; margin: 0; line-height: 1.4; }

.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.gallery-card { background: #101012; border: 1px solid #1c1c21; border-radius: 14px; overflow: hidden; transition: transform .2s ease; }
.gallery-card:hover{ transform: translateY(-3px); }
.gallery-img { width: 100%; height: 130px; background: #16161a; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4b4b52; overflow: hidden; }
.gallery-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
.gallery-img:hover img{ transform: scale(1.06); }
.gallery-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.gallery-body span { font-size: 11.5px; color: #8f8f97; }

.trades-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.trade-card { background: #101012; border: 1px solid #1c1c21; border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.trade-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.4); border-color: #2c2c32; }
.trade-card-img { position: relative; width: 100%; height: 140px; background: #16161a; overflow: hidden; }
.trade-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; display: block; }
.trade-card:hover .trade-card-img img { transform: scale(1.07); }
.trade-card-star { position: absolute; top: 8px; left: 8px; background: rgba(10,10,12,0.6); backdrop-filter: blur(3px); border-radius: 8px; padding: 5px; transition: transform .15s ease, background .15s ease; }
.trade-card-star:hover { background: rgba(10,10,12,0.85); transform: scale(1.1); }
.trade-card-body { padding: 12px 13px; display: flex; flex-direction: column; gap: 7px; }
.trade-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.trade-card-top strong { font-size: 13.5px; }
.trade-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: #8f8f97; gap: 6px; }
.trade-card-meta span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
.trade-card-pl { font-size: 15.5px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
.trade-card-actions { display: flex; gap: 4px; justify-content: flex-end; border-top: 1px solid #1c1c21; padding-top: 7px; margin-top: 1px; }
.detail-image-large { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; margin-bottom: 2px; display: block; }
.lightbox { background: #111114; border-radius: 16px; max-width: 90vw; max-height: 90vh; overflow: auto; position: relative; border: 1px solid #232328; animation: modalIn .2s ease; }
.lightbox img { max-width: 100%; display: block; }
.lightbox-info { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.lightbox-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); }

.tab-switch { display: flex; gap: 6px; background: #131316; border: 1px solid #1f1f24; border-radius: 12px; padding: 4px; width: fit-content; }
.tab-switch button { background: transparent; border: none; color: #8f8f97; padding: 7px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition:.2s; }
.tab-switch .tab-active { background: #ff3d7a; color: #fff; }
.notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.note-card { background: #101012; border: 1px solid #1c1c21; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition:.2s; }
.note-card:hover{ border-color:#2c2c32; }
.note-card-top { display: flex; justify-content: space-between; align-items: baseline; }
.note-date { font-size: 11px; color: #6b6b73; }
.note-card p { font-size: 12.5px; color: #c5c5cb; margin: 0; line-height: 1.5; }
.note-card-footer { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.rules-list { display: flex; flex-direction: column; gap: 8px; }
.rule-row { display: flex; align-items: center; gap: 10px; background: #131316; border: 1px solid #1f1f24; border-radius: 10px; padding: 10px 12px; font-size: 13px; justify-content: space-between; transition:.15s; }
.rule-row:hover{ border-color:#2c2c32; }
.rule-row input { width: 16px; height: 16px; accent-color: #ff3d7a; }

.settings-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.avatar-settings-row{ display:flex; align-items:center; gap:16px; }
.avatar-settings-row img, .avatar-settings-row .brand-avatar-placeholder{ width:64px; height:64px; font-size:20px; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 10px; color: #5c5c63; text-align: center; }
.empty-state svg{ width:30px; height:30px; }
.empty-state p { margin: 0; font-size: 13px; color: #8f8f97; }
.empty-state span { font-size: 11.5px; }

@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -260px; top: 0; height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
  .sidebar-mobile-open { left: 0; }
  .sidebar-collapsed { width: 234px; }
  .sidebar-collapse-btn { display: none; }
  .sidebar-mobile-close { display: flex; margin-left: auto; }
  .sidebar-scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 39; }
  .topbar-menu { display: flex; }
  .topbar-trader { display: none; }
  .app-content { padding: 16px 14px 50px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .page-header { flex-direction: column; }
  .modal { width: 100%; }
  .header-pills { width: 100%; }
  .pill { flex: 1; min-width: 70px; }
}
@media (max-width: 460px) { .stat-grid { grid-template-columns: 1fr 1fr; } .stat-value { font-size: 17px; } }

/* Backtest cards and dedicated analytics dashboard */
.bt-rank-row-expanded{align-items:flex-start;gap:12px}.bt-result-counts{display:block;margin-top:5px;color:#a1a1aa;font-size:11px;line-height:1.6}.bt-rank-row-expanded>div:last-child small{display:block;margin-top:4px;color:#a1a1aa}
.bt-dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.bt-insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bt-insight{background:#101012;border:1px solid #1c1c21;border-radius:14px;padding:16px;min-width:0}
.bt-insight h3{font-size:13px;margin:0 0 12px;color:#d8d8dc}
.bt-rank-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1c1c21;font-size:12px}
.bt-rank-row:last-child{border-bottom:0}.bt-rank-row strong{color:#f5f5f7}
.bt-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.bt-card{background:#101012;border:1px solid #1c1c21;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;}
.bt-card:hover{transform:translateY(-3px);border-color:#383840}.bt-card-img{height:140px;background:#16161a;overflow:hidden}
.bt-card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.bt-card:hover .bt-card-img img{transform:scale(1.04)}
.bt-card-body{padding:12px 13px;display:flex;flex-direction:column;gap:7px}.bt-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bt-card-meta{display:flex;justify-content:space-between;gap:8px;color:#8f8f97;font-size:11.5px}.bt-card-actions{display:flex;justify-content:flex-end;gap:5px;border-top:1px solid #1c1c21;padding-top:7px}
.school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.school-card{border:1px solid #1c1c21;background:#101012;border-radius:14px;overflow:hidden}.school-preview{height:145px;background:#16161a;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#8f8f97}.school-preview img{width:100%;height:100%;object-fit:cover}.school-preview iframe{width:100%;height:100%;border:0}.school-body{padding:13px;display:flex;flex-direction:column;gap:8px}.school-body p{font-size:12px;color:#9a9aa2;margin:0;word-break:break-word}
.topbar-language{margin-left:8px;white-space:nowrap}.rtl-mode{direction:rtl}.rtl-mode .sidebar{border-right:0;border-left:1px solid #1d1d21}.rtl-mode .nav-item{text-align:right}.rtl-mode .nav-item:hover{transform:translateX(-3px)}.rtl-mode .nav-item-active::before{left:auto;right:-10px}.rtl-mode .trade-card-star{left:auto;right:8px}.rtl-mode .toast-stack{right:auto;left:20px}.rtl-mode .topbar-trader{margin-left:0;margin-right:auto}
@media(max-width:768px){.rtl-mode .sidebar{left:auto;right:-260px}.rtl-mode .sidebar-mobile-open{right:0;left:auto}}

let uidCounter = 0;
function uid(){ return Date.now().toString(36) + (uidCounter++).toString(36) + Math.random().toString(36).slice(2,6); }
function esc(str){
  if (str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n, currency){
  currency = currency || "$";
  const v = Number(n) || 0;
  const sign = v < 0 ? "-" : "";
  return sign + currency + Math.abs(v).toFixed(2);
}
function fmtPct(n){ return (Number(n)||0).toFixed(1) + "%"; }
function fmtDate(d){
  const date = new Date(d);
  if (isNaN(date)) return d;
  return date.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}
function dayName(d){ return DAYS[new Date(d).getDay()]; }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

/* ============================================================
   STATS ENGINE
   ============================================================ */
function computeTradeStats(trades){
  const total = trades.length;
  const wins = trades.filter(t=>t.result==="Win");
  const losses = trades.filter(t=>t.result==="Loss");
  const be = trades.filter(t=>t.result==="Break Even");
  const grossProfit = wins.reduce((s,t)=>s+Math.max(0, Number(t.pl)||0), 0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+Math.min(0, Number(t.pl)||0), 0));
  const netProfit = grossProfit - grossLoss;
  const winRate = total ? (wins.length/total)*100 : 0;
  const lossRate = total ? (losses.length/total)*100 : 0;
  const avgWin = wins.length ? grossProfit/wins.length : 0;
  const avgLoss = losses.length ? grossLoss/losses.length : 0;
  const profitFactor = grossLoss > 0 ? grossProfit/grossLoss : (grossProfit>0?grossProfit:0);
  const expectancy = total ? (winRate/100)*avgWin - (lossRate/100)*avgLoss : 0;
  const rValues = trades.map(t=>t.result==="Break Even" ? 0 : (Number(t.rMultiple)||0));
  const avgRR = rValues.length ? rValues.reduce((a,b)=>a+b,0)/rValues.length : 0;
  const totalR = rValues.reduce((a,b)=>a+b,0);

  let maxWinStreak=0, maxLossStreak=0, curWin=0, curLoss=0;
  const sorted = [...trades].sort((a,b)=>new Date(a.date)-new Date(b.date));
  sorted.forEach(t=>{
    if (t.result==="Win"){ curWin++; curLoss=0; }
    else if (t.result==="Loss"){ curLoss++; curWin=0; }
    else { curWin=0; curLoss=0; }
    maxWinStreak = Math.max(maxWinStreak, curWin);
    maxLossStreak = Math.max(maxLossStreak, curLoss);
  });
  let currentStreak=0, currentStreakType=null;
  for (let i=sorted.length-1; i>=0; i--){
    const r = sorted[i].result;
    if (r==="Break Even") break;
    if (currentStreakType===null){ currentStreakType=r; currentStreak=1; }
    else if (r===currentStreakType) currentStreak++;
    else break;
  }
  return { total, wins:wins.length, losses:losses.length, breakEven:be.length, grossProfit, grossLoss, netProfit,
    winRate, lossRate, avgWin, avgLoss, profitFactor, expectancy, avgRR, totalR, maxWinStreak, maxLossStreak, currentStreak, currentStreakType };
}
function buildEquityCurve(startingBalance, trades, balanceHistory){
  const events = [
    ...trades.map(t=>({date:t.date, amount:Number(t.pl)||0, ts:new Date(t.date).getTime()+1})),
    ...balanceHistory.map(b=>({date:b.date, amount: b.type==="Withdrawal" ? -Math.abs(Number(b.amount)||0) : Math.abs(Number(b.amount)||0), ts:new Date(b.date).getTime()})),
  ].sort((a,b)=>a.ts-b.ts);
  let bal = startingBalance;
  const curve = [{ date:"Start", balance: bal }];
  events.forEach(e=>{ bal += e.amount; curve.push({ date: fmtDate(e.date), balance: Number(bal.toFixed(2)) }); });
  return curve;
}
function computeDrawdown(curve){
  let peak = curve.length ? curve[0].balance : 0;
  let maxDD=0, currentDD=0;
  curve.forEach(pt=>{
    if (pt.balance > peak) peak = pt.balance;
    const dd = peak>0 ? ((peak-pt.balance)/peak)*100 : 0;
    if (dd>maxDD) maxDD = dd;
    currentDD = dd;
  });
  return { maxDrawdown:maxDD, currentDrawdown:currentDD };
}
function groupStats(trades, keyFn){
  const map = {};
  trades.forEach(t=>{
    const k = keyFn(t);
    if (!map[k]) map[k] = { key:k, trades:0, wins:0, profit:0, rSum:0 };
    map[k].trades++;
    if (t.result==="Win") map[k].wins++;
    map[k].profit += Number(t.pl)||0;
    map[k].rSum += Number(t.rMultiple)||0;
  });
  return Object.values(map).map(g=>({ ...g, winRate: g.trades ? (g.wins/g.trades)*100 : 0, avgR: g.trades ? g.rSum/g.trades : 0 }));
}

/* ============================================================
   NUMBER COUNT-UP ANIMATION
   ============================================================ */
function animateValue(el, to, opts){
  opts = opts || {};
  const decimals = opts.decimals || 0;
  const prefix = opts.prefix || "";
  const suffix = opts.suffix || "";
  const duration = 650;
  const start = performance.now();
  const from = 0;
  function step(t){
    const progress = clamp((t-start)/duration, 0, 1);
    const eased = 1 - Math.pow(1-progress, 3);
    const val = from + (to-from)*eased;
    el.textContent = prefix + val.toFixed(decimals) + suffix;
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   SELF-CONTAINED CANVAS CHARTS — no external dependency, with mouse-tracking tooltips
   ============================================================ */
function setupCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const width = Math.max(rect.width, 100);
  const height = Math.max(rect.height, 100);
  canvas.width = Math.round(width*dpr);
  canvas.height = Math.round(height*dpr);
  canvas.style.width = width+"px";
  canvas.style.height = height+"px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);
  return { ctx, width, height };
}
function niceAxisValue(v, money, currency){
  const n = Number(v)||0;
  const abs = Math.abs(n);
  const short = abs>=1000 ? (n/1000).toFixed(1)+"k" : n.toFixed(abs<10?1:0);
  return money ? (currency||"$")+short : short;
}
function noDataMsg(ctx,width,height,text){
  ctx.fillStyle = "#4b4b52"; ctx.font = "12px Inter, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text||"No data yet", width/2, height/2);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}
function lightenColor(hex){
  hex = String(hex).replace("#","");
  if (hex.length!==6) return hex;
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  const f=(c)=>Math.min(255, Math.round(c+(255-c)*0.3));
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
function ensureChartTooltip(){

}

function drawEquityChart(canvasId, curve, currency){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const values = curve.map(c=>c.balance);
  const { ctx, width, height } = setupCanvas(canvas);
  if (values.length < 2){ noDataMsg(ctx,width,height,"Add trades or a deposit to see your equity curve"); canvas.onmousemove=null; canvas.onmouseleave=null; return; }
  const pad = { top:14, right:14, bottom:10, left:52 };
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || Math.max(1, Math.abs(max)*0.1) || 1;
  const lo = min - range*0.08, hi = max + range*0.08, span = hi-lo || 1;
  const x = (i)=> pad.left + (i/(values.length-1))*plotW;
  const y = (v)=> pad.top + plotH - ((v-lo)/span)*plotH;

  function renderFrame(hoverIdx){
    ctx.clearRect(0,0,width,height);
    ctx.strokeStyle = "#1f1f24"; ctx.lineWidth = 1; ctx.fillStyle = "#6b6b73"; ctx.font = "10px Inter, sans-serif";
    const steps = 4;
    for (let s=0; s<=steps; s++){
      const v = lo + (span*s/steps);
      const yy = y(v);
      ctx.beginPath(); ctx.moveTo(pad.left,yy); ctx.lineTo(width-pad.right,yy); ctx.stroke();
      ctx.fillText(niceAxisValue(v,true,currency), 2, yy+3);
    }
    ctx.beginPath(); ctx.moveTo(x(0), y(values[0]));
    values.forEach((v,i)=>{ if(i>0) ctx.lineTo(x(i), y(v)); });
    ctx.lineTo(x(values.length-1), pad.top+plotH); ctx.lineTo(x(0), pad.top+plotH); ctx.closePath();
    const grad = ctx.createLinearGradient(0,pad.top,0,pad.top+plotH);
    grad.addColorStop(0,"rgba(255,61,122,0.35)"); grad.addColorStop(1,"rgba(255,61,122,0)");
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x(0), y(values[0]));
    values.forEach((v,i)=>{ if(i>0) ctx.lineTo(x(i), y(v)); });
    ctx.strokeStyle = "#ff3d7a"; ctx.lineWidth = 2; ctx.lineJoin="round"; ctx.stroke();
    if (hoverIdx==null){
      const lastX = x(values.length-1), lastY = y(values[values.length-1]);
      ctx.beginPath(); ctx.arc(lastX,lastY,3.5,0,Math.PI*2); ctx.fillStyle="#ff3d7a"; ctx.fill();
    } else {
      const hx = x(hoverIdx), hy = y(values[hoverIdx]);
      ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(hx,pad.top); ctx.lineTo(hx,pad.top+plotH); ctx.stroke(); ctx.restore();
      ctx.beginPath(); ctx.arc(hx,hy,5.5,0,Math.PI*2); ctx.fillStyle="#0c0c0e"; ctx.fill();
      ctx.beginPath(); ctx.arc(hx,hy,3.5,0,Math.PI*2); ctx.fillStyle="#ff3d7a"; ctx.fill();
    }
  }
  renderFrame(null);
  canvas.onmousemove = function(e){
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let nearest = 0, minD = Infinity;
    values.forEach((v,i)=>{ const d = Math.abs(x(i)-mx); if (d<minD){ minD=d; nearest=i; } });
    renderFrame(nearest);
    showChartTooltip(e.clientX, e.clientY, "<strong>"+esc(curve[nearest].date)+"</strong><br>"+fmtMoney(values[nearest], currency));
  };
  canvas.onmouseleave = function(){ renderFrame(null); hideChartTooltip(); };
}

function drawBarChart(canvasId, labels, values, colorFn, opts){
  opts = opts || {};
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const { ctx, width, height } = setupCanvas(canvas);
  if (!values.length || values.every(v=>!v)){ noDataMsg(ctx,width,height); canvas.onmousemove=null; canvas.onmouseleave=null; return; }
  const pad = { top:14, right:10, bottom:22, left:44 };
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const maxAbs = Math.max(1, ...values.map(v=>Math.abs(v)));
  const hasNeg = values.some(v=>v<0);
  const zeroY = hasNeg ? pad.top + plotH/2 : pad.top + plotH;
  const scale = hasNeg ? (plotH/2)/maxAbs : plotH/maxAbs;
  const n = values.length;
  const slot = plotW/n;
  const barW = Math.min(34, slot*0.55);
  const bars = values.map((v,i)=>{
    const cx = pad.left + slot*i + slot/2;
    const barH = Math.abs(v)*scale;
    const barY = v>=0 ? zeroY-barH : zeroY;
    return { cx, barY, barH: Math.max(barH,1.5), v, label: labels[i] };
  });

  function renderFrame(hoverIdx){
    ctx.clearRect(0,0,width,height);
    ctx.strokeStyle = "#1f1f24"; ctx.lineWidth = 1; ctx.fillStyle = "#6b6b73"; ctx.font = "10px Inter, sans-serif";
    const gridLines = hasNeg ? [pad.top, zeroY, pad.top+plotH] : [pad.top, pad.top+plotH/2, pad.top+plotH];
    gridLines.forEach(gy=>{ ctx.beginPath(); ctx.moveTo(pad.left,gy); ctx.lineTo(width-pad.right,gy); ctx.stroke(); });
    ctx.fillText(niceAxisValue(hasNeg?0:maxAbs, opts.money, opts.currency), 2, gridLines[0]+3);
    if (hasNeg) ctx.fillText(niceAxisValue(0, opts.money, opts.currency), 2, zeroY+3);
    bars.forEach((b,i)=>{
      const baseColor = colorFn ? colorFn(b.v,i) : "#ff3d7a";
      ctx.fillStyle = i===hoverIdx ? lightenColor(baseColor.startsWith("#")?baseColor:"#ff3d7a") : baseColor;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(b.cx-barW/2, b.barY, barW, b.barH, 3); else ctx.rect(b.cx-barW/2, b.barY, barW, b.barH);
      ctx.fill();
      if (i===hoverIdx){ ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.5; ctx.stroke(); }
      if (b.label !== undefined){
        ctx.fillStyle = i===hoverIdx ? "#f5f5f7" : "#6b6b73"; ctx.font = "9.5px Inter, sans-serif"; ctx.textAlign = "center";
        const lbl = String(b.label).length>6 ? String(b.label).slice(0,6) : b.label;
        ctx.fillText(lbl, b.cx, height-6);
        ctx.textAlign = "left";
      }
    });
  }
  renderFrame(null);
  canvas.onmousemove = function(e){
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    let hover = -1;
    bars.forEach((b,i)=>{ if (mx>=b.cx-slot/2 && mx<b.cx+slot/2) hover=i; });
    if (hover<0){ renderFrame(null); hideChartTooltip(); return; }
    renderFrame(hover);
    const valStr = opts.money ? fmtMoney(bars[hover].v, opts.currency) : bars[hover].v;
    showChartTooltip(e.clientX, e.clientY, "<strong>"+esc(String(bars[hover].label))+"</strong><br>"+valStr);
  };
  canvas.onmouseleave = function(){ renderFrame(null); hideChartTooltip(); };
}

function drawDonutChart(canvasId, labels, values){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const { ctx, width, height } = setupCanvas(canvas);
  const colors = ["#22c55e","#ef4444","#eab308"];
  const total = values.reduce((a,b)=>a+b,0);
  const legendEl = document.getElementById(canvasId+"Legend");
  if (!total){ noDataMsg(ctx,width,height); if (legendEl) legendEl.innerHTML=""; canvas.onmousemove=null; canvas.onmouseleave=null; return; }
  const cx = width/2, cy = height/2, outerR = Math.min(width,height)/2 - 8, innerR = outerR*0.6;
  let acc = -Math.PI/2;
  const segs = values.map((v,i)=>{
    const angle = (v/total)*Math.PI*2;
    const seg = { start:acc, end:acc+angle, relStart:acc+Math.PI/2, relEnd:acc+angle+Math.PI/2, label:labels[i], value:values[i], color:colors[i%colors.length] };
    acc += angle;
    return seg;
  });

  function renderFrame(hoverIdx){
    ctx.clearRect(0,0,width,height);
    segs.forEach((seg,i)=>{
      const isHover = i===hoverIdx;
      const r = isHover ? outerR+3 : outerR;
      ctx.beginPath();
      ctx.arc(cx,cy,r,seg.start,seg.end);
      ctx.arc(cx,cy,innerR,seg.end,seg.start,true);
      ctx.closePath();
      ctx.fillStyle = isHover ? lightenColor(seg.color) : seg.color;
      ctx.fill();
    });
  }
  renderFrame(null);
  if (legendEl){
    legendEl.innerHTML = labels.map((l,i)=>`<span><span class="dot" style="background:${colors[i%colors.length]}"></span>${l} (${values[i]})</span>`).join("");
  }
  canvas.onmousemove = function(e){
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const dx = mx-cx, dy = my-cy, dist = Math.sqrt(dx*dx+dy*dy);
    if (dist<innerR || dist>outerR+4){ renderFrame(null); hideChartTooltip(); return; }
    let rel = Math.atan2(dy,dx) + Math.PI/2; if (rel<0) rel += Math.PI*2;
    const idx = segs.findIndex(s=> rel>=s.relStart && rel<s.relEnd);
    if (idx<0){ renderFrame(null); hideChartTooltip(); return; }
    renderFrame(idx);
    const pct = total>0 ? ((segs[idx].value/total)*100).toFixed(1) : "0.0";
    showChartTooltip(e.clientX, e.clientY, "<strong>"+esc(segs[idx].label)+"</strong><br>"+segs[idx].value+" ("+pct+"%)");
  };
  canvas.onmouseleave = function(){ renderFrame(null); hideChartTooltip(); };
}

function debounce(fn, wait){ let t; return function(){ clearTimeout(t); t=setTimeout(fn,wait); }; }

function currentBalance(){
  const netTradeProfit = state.trades.reduce((s,t)=>s+(Number(t.pl)||0),0);
  const deposits = state.balanceHistory.filter(b=>b.type==="Deposit").reduce((s,b)=>s+Math.abs(Number(b.amount)||0),0);
  const withdrawals = state.balanceHistory.filter(b=>b.type==="Withdrawal").reduce((s,b)=>s+Math.abs(Number(b.amount)||0),0);
  return state.startingBalance + deposits - withdrawals + netTradeProfit;
}

function imageDropHtml(value, hiddenFieldId){
  return `<div class="image-drop" id="dropZone_${hiddenFieldId}">
    ${value ? `<div class="image-drop-preview"><img src="${value}"/><button type="button" class="btn btn-ghost btn-sm" id="removeImg_${hiddenFieldId}">${icon("trash-2",13)} Remove</button></div>`
      : `<div class="image-drop-empty">${icon("upload",20)}<span>Drag & drop or click to upload chart</span></div>`}
    <input type="file" accept="image/*" hidden id="${hiddenFieldId}"/></div>`;
}
function wireImageDrop(container, hiddenFieldId, currentValue, onChange){
  const dz = container.querySelector("#dropZone_"+hiddenFieldId);
  const input = container.querySelector("#"+hiddenFieldId);
  let value = currentValue;
  dz.addEventListener("click", (e)=>{ if (e.target.closest("#removeImg_"+hiddenFieldId)) return; input.click(); });
  dz.addEventListener("dragover", (e)=>e.preventDefault());
  dz.addEventListener("drop", (e)=>{ e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
  input.addEventListener("change", (e)=>handleFile(e.target.files[0]));
  function handleFile(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ value = reader.result; onChange(value); dz.outerHTML = imageDropHtml(value, hiddenFieldId); wireImageDrop(container, hiddenFieldId, value, onChange); renderIcons(); };
    reader.readAsDataURL(file);
  }
  const removeBtn = container.querySelector("#removeImg_"+hiddenFieldId);
  if (removeBtn) removeBtn.addEventListener("click", (e)=>{ e.stopPropagation(); value=null; onChange(null); dz.outerHTML = imageDropHtml(null, hiddenFieldId); wireImageDrop(container, hiddenFieldId, null, onChange); renderIcons(); });
}

function openTradeModal(trade){
  let screenshotValue = trade ? trade.screenshot : null;
  const modal = openModal(trade?"Edit Trade":"Add New Trade", tradeFormHtml(trade), { wide:true, onMount:(wrap)=>{
    wireImageDrop(wrap, "f_screenshot", screenshotValue, (v)=>{ screenshotValue = v; });
    wrap.querySelector("#cancelTradeBtn").addEventListener("click", closeModal);
    wrap.querySelector("#saveTradeBtn").addEventListener("click", ()=>{
      const g = (id)=>wrap.querySelector("#"+id);
      const confirmations = Array.from(wrap.querySelectorAll(".f_confirm:checked")).map(c=>c.value);
      const result = g("f_result").value;
      const balanceBefore = trade ? trade.balanceBefore : currentBalance();
      const riskPercent = Number(g("f_riskpct").value)||0;
      const manualRisk = g("f_riskdollar").value;
      const riskDollar = manualRisk!=="" ? Number(manualRisk) : Number((balanceBefore*(riskPercent/100)).toFixed(2));
      const rrActual = Number(g("f_rractual").value)||Number(g("f_rrplanned").value)||0;
      const rMultiple = result==="Win" ? rrActual : result==="Loss" ? -1 : 0;
      const lotSize = Number(g("f_lotsize").value)||1;
      const manualPLRaw = g("f_manualpl").value;
      const basePL = manualPLRaw!=="" ? Number(manualPLRaw) : (result==="Win" ? riskDollar*rrActual : result==="Loss" ? -riskDollar : 0);
      const pl = basePL * lotSize;
      const final = {
        id: trade?trade.id:uid(), date:g("f_date").value, time:g("f_time").value, day:dayName(g("f_date").value),
        pair:g("f_pair").value, direction:g("f_direction").value, session:g("f_session").value, timeframe:g("f_timeframe").value,
        setup:g("f_setup").value, strategy:g("f_setup").value, marketStructure:g("f_structure").value,
        entry:g("f_entry").value, stopLoss:g("f_sl").value, takeProfit:g("f_tp").value,
        riskPercent, riskDollar, rrPlanned:Number(g("f_rrplanned").value)||0, rrActual,
        lotSize, manualPL: manualPLRaw!=="" ? Number(manualPLRaw) : null,
        reason:g("f_reason").value, confirmations, result, pl:Number(pl.toFixed(2)), rMultiple:Number(rMultiple.toFixed(2)),
        balanceBefore, balanceAfter:Number((balanceBefore+pl).toFixed(2)),
        emotionBefore:g("f_emobefore").value, emotionAfter:g("f_emoafter").value, screenshot:screenshotValue,
        analysis:{ marketContext:g("f_ctx").value, entryReason:g("f_entryreason").value, confirmation:g("f_setup").value, whatHappened:g("f_whathappened").value, mistake:g("f_mistake").value, whatLearned:g("f_learned").value },
        isBest: trade?trade.isBest:false,
      };
      if (trade){ state.trades = state.trades.map(t=>t.id===trade.id?final:t); } else { state.trades.push(final); }
      saveState(); closeModal(); toast("Trade saved successfully."); renderAll();
    });
  }});
}

function duplicateTrade(id){
  const t = state.trades.find(x=>x.id===id);
  if (!t) return;
  state.trades.push({ ...t, id:uid(), date:new Date().toISOString().slice(0,10) });
  saveState(); toast("Trade duplicated."); renderAll();
}
async function deleteTrade(id){
  const ok = await confirmDialog("Are you sure you want to delete this trade?");
  if (!ok) return;
  state.trades = state.trades.filter(t=>t.id!==id);
  saveState(); toast("Trade deleted.","danger"); renderAll();
}
function toggleBest(id){
  state.trades = state.trades.map(t=>t.id===id?{...t,isBest:!t.isBest}:t);
  saveState(); renderAll();
}

let backtestFilter = { search:"", result:"All", pair:"All", setup:"All", session:"All", page:1 };
function emptyBacktest(){
  return { id:null, date:new Date().toISOString().slice(0,10), pair:PAIRS[0], session:SESSIONS[0], setup:SETUPS[0],
    direction:"Buy", entry:"", stopLoss:"", takeProfit:"", rr:2, lotSize:1, manualPL:null, result:"Win", rMultiple:0, pl:0, screenshot:null, notes:"" };

function renderBacktest(){
  const currency = state.settings.currency;
  const all = state.backtests || [];
  const stats = computeTradeStats(all);
  const startBal = state.settings.backtestStartingBalance || 0;
  const endBal = startBal + all.reduce((s,b)=>s+(b.result==="Break Even"?0:(Number(b.pl)||0)),0);
  let list = all.filter(b=>
    (backtestFilter.result==="All" || b.result===backtestFilter.result) &&
    (backtestFilter.pair==="All" || b.pair===backtestFilter.pair) &&
    (backtestFilter.setup==="All" || b.setup===backtestFilter.setup) &&
    (backtestFilter.session==="All" || b.session===backtestFilter.session) &&
    (backtestFilter.search==="" || (b.pair+" "+b.setup+" "+b.session+" "+b.direction+" "+b.result+" "+(b.notes||"")).toLowerCase().includes(backtestFilter.search.toLowerCase()))
  );
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  // Display every matching backtest record in one continuous, vertically scrolling list.
  const pageItems = list;
  const group=(key)=>{const m={};all.forEach(x=>{const k=x[key]||"Unknown";if(!m[k])m[k]={name:k,total:0,wins:0,losses:0,breakEven:0,pl:0};m[k].total++;if(x.result==="Win")m[k].wins++;else if(x.result==="Loss")m[k].losses++;else if(x.result==="Break Even")m[k].breakEven++;m[k].pl+=Number(x.pl)||0;});return Object.values(m).sort((a,b)=>b.wins/(b.total||1)-a.wins/(a.total||1)||b.pl-a.pl)};
  const setups=group("setup"), sessions=group("session");
  const dayMap={}; all.forEach(x=>{const d=x.date?new Date(x.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"long"}):"Unknown";if(!dayMap[d])dayMap[d]={name:d,total:0,wins:0,losses:0,breakEven:0,pl:0};dayMap[d].total++;if(x.result==="Win")dayMap[d].wins++;else if(x.result==="Loss")dayMap[d].losses++;else if(x.result==="Break Even")dayMap[d].breakEven++;dayMap[d].pl+=Number(x.pl)||0;});
  const days=Object.values(dayMap).sort((a,b)=>b.wins/(b.total||1)-a.wins/(a.total||1)||b.pl-a.pl);
  const rankRows=(arr,empty)=>arr.length?arr.slice(0,5).map(x=>`<div class="bt-rank-row bt-rank-row-expanded"><div><strong>${esc(x.name)}</strong><small class="bt-result-counts">Total ${x.total} · <span class="text-green">W ${x.wins}</span> · <span class="text-red">L ${x.losses}</span> · <span style="color:#facc15">BE ${x.breakEven}</span></small></div><div style="text-align:right"><strong>${Math.round(x.wins/x.total*100)}%</strong><small>${fmtMoney(x.pl,currency)}</small></div></div>`).join(""):`<div class="empty-state"><p>${empty}</p></div>`;
  afterRenderHooks.backtest = function(){
    const c=document.getElementById("content");
    c.querySelector("#btSearchApply").addEventListener("click",()=>{backtestFilter.search=c.querySelector("#btSearch").value.trim();backtestFilter.page=1;renderAll();});
    c.querySelector("#btSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();c.querySelector("#btSearchApply").click();}});
    ["btFilterResult","btFilterPair","btFilterSetup","btFilterSession"].forEach(id=>c.querySelector("#"+id).addEventListener("change",e=>{const key={btFilterResult:"result",btFilterPair:"pair",btFilterSetup:"setup",btFilterSession:"session"}[id];backtestFilter[key]=e.target.value;backtestFilter.page=1;renderAll();}));
    c.querySelector("#btResetFilters").addEventListener("click",()=>{backtestFilter={search:"",result:"All",pair:"All",setup:"All",session:"All",page:1};renderAll();});
    c.querySelector("#addBtBtn").addEventListener("click",()=>openBacktestModal(null));
    const tc=c.querySelector("#traderCaseBtn");if(tc)tc.addEventListener("click",openTraderCase);
    c.querySelectorAll("[data-edit-bt]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openBacktestModal(all.find(x=>x.id===b.dataset.editBt));}));
    c.querySelectorAll("[data-del-bt]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();deleteBacktest(b.dataset.delBt);}));
    c.querySelectorAll(".bt-card").forEach(card=>card.addEventListener("click",()=>viewBacktest(all.find(x=>x.id===card.dataset.btId))));
    const prev=c.querySelector("#btPrev"),next=c.querySelector("#btNext");if(prev)prev.addEventListener("click",()=>{backtestFilter.page--;renderAll();});if(next)next.addEventListener("click",()=>{backtestFilter.page++;renderAll();});
  };
  return `

  <div class="toolbar"><div class="bt-search-actions"><div class="search-box">${icon("search",15)}<input id="btSearch" placeholder="Search pair, setup, session, notes..." value="${esc(backtestFilter.search)}"/></div><button class="btn btn-primary btn-sm" id="btSearchApply">Search</button></div>

function openBacktestModal(record){
  const f = record || emptyBacktest();
  let screenshotValue = f.screenshot;
  const html = `
  <div class="form-row">
    <label class="field"><span class="field-label">Date</span><input type="date" id="b_date" value="${f.date}"/></label>
    <label class="field"><span class="field-label">Pair</span><select id="b_pair">${PAIRS.map(p=>`<option ${f.pair===p?'selected':''}>${p}</option>`).join("")}</select></label>
    <label class="field"><span class="field-label">Session</span><select id="b_session">${SESSIONS.map(s=>`<option ${f.session===s?'selected':''}>${s}</option>`).join("")}</select></label>
  </div>
  <div class="form-row">
    <label class="field"><span class="field-label">Setup</span><select id="b_setup">${SETUPS.map(s=>`<option ${f.setup===s?'selected':''}>${s}</option>`).join("")}</select></label>
    <label class="field"><span class="field-label">Direction</span><select id="b_direction"><option ${f.direction==='Buy'?'selected':''}>Buy</option><option ${f.direction==='Sell'?'selected':''}>Sell</option></select></label>
    <label class="field"><span class="field-label">RR</span><input type="number" step="0.1" id="b_rr" value="${f.rr}"/></label>
  </div>
  <div class="form-row">
    <label class="field"><span class="field-label">Entry</span><input type="number" step="0.0001" id="b_entry" value="${f.entry}"/></label>
    <label class="field"><span class="field-label">Stop Loss</span><input type="number" step="0.0001" id="b_sl" value="${f.stopLoss}"/></label>
    <label class="field"><span class="field-label">Take Profit</span><input type="number" step="0.0001" id="b_tp" value="${f.takeProfit}"/></label>
  </div>
  <div class="form-row">
    <label class="field"><span class="field-label">Lot Size</span><input type="number" step="0.01" min="0.01" id="b_lotsize" value="${f.lotSize||1}"/></label>
    <label class="field"><span class="field-label">Manual P/L (optional override)</span><input type="number" step="0.01" id="b_manualpl" value="${f.manualPL!==undefined && f.manualPL!==null && f.manualPL!==''?f.manualPL:''}" placeholder="leave empty to auto-calculate"/></label>
  </div>
  <label class="field"><span class="field-label">Result</span><select id="b_result"><option ${f.result==='Win'?'selected':''}>Win</option><option ${f.result==='Loss'?'selected':''}>Loss</option><option ${f.result==='Break Even'?'selected':''}>Break Even</option></select></label>
  ${sectionTitle("image","Screenshot")}<div id="b_imagedrop">${imageDropHtml(f.screenshot,"b_screenshot")}</div>
  <label class="field"><span class="field-label">Notes</span><textarea id="b_notes" rows="2">${esc(f.notes)}</textarea></label>
  <div class="modal-footer"><button class="btn btn-ghost" id="cancelBtBtn">Cancel</button><button class="btn btn-primary" id="saveBtBtn">Save</button></div>`;
  openModal(record?"Edit Backtest":"Add Backtest Record", html, { wide:true, onMount:(wrap)=>{
    wireImageDrop(wrap, "b_screenshot", screenshotValue, (v)=>{ screenshotValue = v; });
    wrap.querySelector("#cancelBtBtn").addEventListener("click", closeModal);
    wrap.querySelector("#saveBtBtn").addEventListener("click", ()=>{
      const g=(id)=>wrap.querySelector("#"+id);
      const riskBase = state.settings.backtestStartingBalance || 0;
      const riskDollar = riskBase*0.01;
      const result = g("b_result").value;
      const rr = Number(g("b_rr").value)||0;
      const rMultiple = result==="Win"?rr:result==="Loss"?-1:0;
      const lotSize = Number(g("b_lotsize").value)||1;
      const manualPLRaw = g("b_manualpl").value;
      const basePL = manualPLRaw!=="" ? Number(manualPLRaw) : (result==="Win"?riskDollar*rr:result==="Loss"?-riskDollar:0);
      const pl = result==="Break Even" ? 0 : basePL * lotSize;
      const final = { id:record?record.id:uid(), date:g("b_date").value, pair:g("b_pair").value, session:g("b_session").value, setup:g("b_setup").value,
        direction:g("b_direction").value, entry:g("b_entry").value, stopLoss:g("b_sl").value, takeProfit:g("b_tp").value, rr,
        lotSize, manualPL: manualPLRaw!=="" ? Number(manualPLRaw) : null,
        result, rMultiple:Number(rMultiple.toFixed(2)), pl:Number(pl.toFixed(2)), screenshot:screenshotValue, notes:g("b_notes").value };
      if (record){ state.backtests = state.backtests.map(b=>b.id===record.id?final:b); } else { state.backtests.push(final); }
      saveState(); closeModal(); toast("Backtest record saved."); renderAll();
    });
  }});
}
async function deleteBacktest(id){
  const ok = await confirmDialog("Are you sure you want to delete this backtest record?");
  if (!ok) return;
  state.backtests = state.backtests.filter(b=>b.id!==id);
  saveState(); toast("Backtest record deleted.","danger"); renderAll();
}
function openTraderCase(){
  const url = state.settings.traderCaseUrl;

  window.open(url, "_blank");

   PERFORMANCE PAGE
   ============================================================ */
function renderPerformance(){
  const currency = state.settings.currency;
  const trades = state.trades;
  const stats = computeTradeStats(trades);
  const curve = buildEquityCurve(state.startingBalance, trades, state.balanceHistory);
  const dd = computeDrawdown(curve);
  const recoveryFactor = dd.maxDrawdown>0 ? (stats.netProfit/((dd.maxDrawdown/100)*(curve[0]?.balance||1)))||0 : 0;

  const dayOrder = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
  const byDay = dayOrder.map(d=>{ const g = groupStats(trades.filter(t=>t.day===d), ()=>d)[0]; return g || { key:d, trades:0, winRate:0, profit:0 }; });
  const bySession = groupStats(trades, t=>t.session);
  const byTimeframe = groupStats(trades, t=>t.timeframe);
  const bySetup = groupStats(trades, t=>t.setup).sort((a,b)=>b.winRate-a.winRate);
  const byEmotion = groupStats(trades, t=>t.emotionBefore).sort((a,b)=>b.winRate-a.winRate);

  const todayTrades = trades.filter(t=>t.date===new Date().toISOString().slice(0,10));
  const todayLoss = Math.abs(todayTrades.filter(t=>t.pl<0).reduce((s,t)=>s+t.pl,0));
  const balance = curve.at(-1)?.balance || state.startingBalance;
  const dailyLossLimitAmt = balance*(state.settings.maxDailyLoss/100);
  const riskLevel = todayLoss>=dailyLossLimitAmt && dailyLossLimitAmt>0 ? "exceeded" : todayLoss>=dailyLossLimitAmt*0.7 && dailyLossLimitAmt>0 ? "warning" : "safe";

  afterRenderHooks.performance = function(){
    drawBarChart("chartByDay", byDay.map(d=>d.key.slice(0,3)), byDay.map(d=>Number(d.profit.toFixed(2))), (v)=>v>=0?"#22c55e":"#ef4444", {money:true, currency});
    drawBarChart("chartBySession", bySession.map(d=>d.key), bySession.map(d=>Number(d.profit.toFixed(2))), (v)=>v>=0?"#22c55e":"#ef4444", {money:true, currency});
  };

  return `
  <div class="page-header"><div><h1>Performance</h1><p class="page-sub">Deep analytics across time, setup, and psychology.</p></div></div>
  <div class="stat-grid">
    ${statCardStatic("target","Win Rate","#22c55e",fmtPct(stats.winRate))}
    ${statCardStatic("target","Loss Rate","#ef4444",fmtPct(stats.lossRate))}
    ${statCardStatic("award","Profit Factor","#ff3d7a",stats.profitFactor.toFixed(2))}
    ${statCardStatic("arrow-up-right","Average Win","#22c55e",fmtMoney(stats.avgWin,currency))}
    ${statCardStatic("arrow-down-right","Average Loss","#ef4444",fmtMoney(stats.avgLoss,currency))}
    ${statCardStatic("trending-up","Expectancy","#ff3d7a",fmtMoney(stats.expectancy,currency))}
    ${statCardStatic("percent","Average RR","#eab308","1:"+stats.avgRR.toFixed(1))}
    ${statCardStatic("flame","Max Win Streak","#22c55e",stats.maxWinStreak)}
    ${statCardStatic("alert-triangle","Max Loss Streak","#ef4444",stats.maxLossStreak)}
    ${statCardStatic("arrow-down-right","Max Drawdown","#ef4444",fmtPct(dd.maxDrawdown))}
    ${statCardStatic("rotate-ccw","Recovery Factor","#60a5fa",recoveryFactor.toFixed(2))}
    ${statCardStatic("bar-chart-3","Total R","#ff3d7a",stats.totalR.toFixed(1)+"R")}
  </div>
  <div class="card">${sectionTitle("shield","Risk Management")}
    <div class="risk-banner risk-${riskLevel}">${riskLevel==='safe'?icon("check-circle-2",18)+' Risk Safe — within your daily loss limit':riskLevel==='warning'?icon("alert-triangle",18)+' Risk Warning — approaching your daily loss limit':icon("alert-triangle",18)+' Risk Limit Exceeded — stop trading for today'}</div>
    <div class="stat-grid" style="margin-top:14px;">
      ${statCardStatic("percent","Risk per Trade","#ff3d7a",fmtPct(state.settings.defaultRisk))}
      ${statCardStatic("alert-triangle","Max Daily Risk","#eab308",fmtPct(state.settings.maxDailyLoss))}
      ${statCardStatic("alert-triangle","Max Consecutive Losses","#ef4444",stats.maxLossStreak)}
      ${statCardStatic("wallet","Current Drawdown","#ef4444",fmtPct(dd.currentDrawdown))}
    </div>
  </div>
  <div class="grid-2">
    <div class="card chart-card">${sectionTitle("calendar","Performance by Day")}<div class="chart-wrap-sm"><canvas id="chartByDay"></canvas></div></div>
    <div class="card chart-card">${sectionTitle("calendar","Performance by Session")}<div class="chart-wrap-sm"><canvas id="chartBySession"></canvas></div></div>
  </div>
  <div class="grid-2">
    <div class="card">${sectionTitle("bar-chart-3","Performance by Setup")}
      <div class="table-scroll"><table class="data-table"><thead><tr><th>Setup</th><th>Trades</th><th>Win Rate</th><th>Profit</th></tr></thead>
      <tbody>${bySetup.length?bySetup.map(s=>`<tr><td>${esc(s.key)}</td><td>${s.trades}</td><td>${fmtPct(s.winRate)}</td><td class="${s.profit>=0?'text-green':'text-red'}">${fmtMoney(s.profit,currency)}</td></tr>`).join(""):`<tr><td colspan="4">${emptyState("bar-chart-3","No data yet")}</td></tr>`}</tbody></table></div></div>
    <div class="card">${sectionTitle("bar-chart-3","Performance by Timeframe")}
      <div class="table-scroll"><table class="data-table"><thead><tr><th>Timeframe</th><th>Trades</th><th>Win Rate</th><th>Profit</th></tr></thead>
      <tbody>${byTimeframe.length?byTimeframe.map(s=>`<tr><td>${esc(s.key)}</td><td>${s.trades}</td><td>${fmtPct(s.winRate)}</td><td class="${s.profit>=0?'text-green':'text-red'}">${fmtMoney(s.profit,currency)}</td></tr>`).join(""):`<tr><td colspan="4">${emptyState("bar-chart-3","No data yet")}</td></tr>`}</tbody></table></div></div>
  </div>
  <div class="card">${sectionTitle("book-open","Trading Psychology")}
    <p class="page-sub" style="margin-bottom:12px;">How your emotional state before entry correlates with results.</p>
    <div class="psych-grid">${byEmotion.length?byEmotion.map(e=>`<div class="psych-card"><span class="psych-emotion">${e.key}</span><div class="psych-bar-track"><div class="psych-bar-fill" style="width:${clamp(e.winRate,0,100)}%;background:${e.winRate>=60?'#22c55e':e.winRate>=40?'#eab308':'#ef4444'}"></div></div><span class="psych-pct">${fmtPct(e.winRate)} win rate · ${e.trades} trades</span></div>`).join(""):emptyState("book-open","No psychology data yet","Log your emotion before/after trades to see this.")}</div>
  </div>`;
}

function renderAccount(){
  const currency = state.settings.currency;
  const netTradeProfit = state.trades.reduce((s,t)=>s+(Number(t.pl)||0),0);
  const deposits = state.balanceHistory.filter(b=>b.type==="Deposit").reduce((s,b)=>s+Math.abs(Number(b.amount)||0),0);
  const withdrawals = state.balanceHistory.filter(b=>b.type==="Withdrawal").reduce((s,b)=>s+Math.abs(Number(b.amount)||0),0);
  const balance = state.startingBalance + deposits - withdrawals + netTradeProfit;
  const totalReturn = state.startingBalance>0 ? ((balance-state.startingBalance)/state.startingBalance)*100 : (balance!==0 ? 100 : 0);
  const curve = buildEquityCurve(state.startingBalance, state.trades, state.balanceHistory);
  const dd = computeDrawdown(curve);
  const history = [...state.balanceHistory].sort((a,b)=>new Date(b.date)-new Date(a.date));

  afterRenderHooks.account = function(){
    const c = document.getElementById("content");
    c.querySelector("#addEntryBtn").addEventListener("click", openBalanceModal);
    c.querySelectorAll("[data-del-balance]").forEach(b=>b.addEventListener("click",()=>deleteBalanceEntry(b.dataset.delBalance)));
    drawEquityChart("chartAccountEquity", curve, currency);
  };

  return `
  <div class="page-header"><div><h1>Account</h1><p class="page-sub">Balance, deposits, withdrawals and drawdown.</p></div>
    <button class="btn btn-primary" id="addEntryBtn">${icon("plus",16)} Add Entry</button></div>
  <div class="stat-grid">
    ${statCardStatic("wallet","Starting Balance","#9a9aa2",fmtMoney(state.startingBalance,currency))}
    ${statCardStatic("wallet","Current Balance","#ff3d7a",fmtMoney(balance,currency))}
    ${statCardStatic("arrow-up-right","Deposits","#22c55e",fmtMoney(deposits,currency))}
    ${statCardStatic("arrow-down-right","Withdrawals","#ef4444",fmtMoney(withdrawals,currency))}
    ${statCardStatic("trending-up","Net Profit","#22c55e",fmtMoney(netTradeProfit,currency))}
    ${statCardStatic("percent","Total Return","#eab308",fmtPct(totalReturn))}
    ${statCardStatic("arrow-down-right","Current Drawdown","#ef4444",fmtPct(dd.currentDrawdown))}
    ${statCardStatic("arrow-down-right","Maximum Drawdown","#ef4444",fmtPct(dd.maxDrawdown))}
  </div>
  <div class="card chart-card">${sectionTitle("trending-up","Balance Growth")}<div class="chart-wrap"><canvas id="chartAccountEquity"></canvas></div></div>
  <div class="card">${sectionTitle("wallet","Balance History")}
    <div class="table-scroll"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Notes</th><th></th></tr></thead>
    <tbody>${history.length?history.map(b=>`<tr><td>${fmtDate(b.date)}</td><td><span class="badge ${b.type==='Deposit'?'badge-green':b.type==='Withdrawal'?'badge-red':'badge-yellow'}">${b.type}</span></td><td class="${b.type==='Withdrawal'?'text-red':'text-green'}">${fmtMoney(b.amount,currency)}</td><td>${esc(b.notes)}</td><td><button class="icon-btn-xs" data-del-balance="${b.id}">${icon("trash-2",14,"#ef4444")}</button></td></tr>`).join(""):`<tr><td colspan="5">${emptyState("wallet","No balance history yet","Add your starting deposit to begin.")}</td></tr>`}</tbody></table></div>
  </div>`;
}

let notesSearch = "";
function renderNotes(){
  const filtered = state.notes.filter(n=> notesSearch==="" || (n.title+" "+n.content+" "+(n.tags||[]).join(" ")).toLowerCase().includes(notesSearch.toLowerCase()));
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const rules = state.settings.rules;
  const rulesFollowed = rules.length ? (rules.filter(r=>r.checked).length/rules.length)*100 : 0;

  afterRenderHooks.notes = function(){
    const c = document.getElementById("content");
    c.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ notesTab=b.dataset.tab; renderAll(); }));
    if (notesTab==="notes"){
      const addBtn = c.querySelector("#addNoteBtn"); if (addBtn) addBtn.addEventListener("click",()=>openNoteModal(null));
      const searchEl = c.querySelector("#notesSearchInput"); if (searchEl) searchEl.addEventListener("input",(e)=>{ notesSearch=e.target.value; renderAll(); });
      c.querySelectorAll("[data-edit-note]").forEach(b=>b.addEventListener("click",()=>openNoteModal(state.notes.find(x=>x.id===b.dataset.editNote))));
      c.querySelectorAll("[data-del-note]").forEach(b=>b.addEventListener("click",()=>deleteNote(b.dataset.delNote)));
    } else {
      c.querySelectorAll("[data-toggle-rule]").forEach(b=>b.addEventListener("change",()=>toggleRule(b.dataset.toggleRule)));
    }
  };

  return `
  <div class="page-header"><div><h1>Notes</h1><p class="page-sub">Journal entries and your personal trading rules.</p></div>
    ${notesTab==="notes"?`<button class="btn btn-primary" id="addNoteBtn">${icon("plus",16)} Add Note</button>`:""}</div>
  <div class="tab-switch"><button class="${notesTab==='notes'?'tab-active':''}" data-tab="notes">Journal</button><button class="${notesTab==='rules'?'tab-active':''}" data-tab="rules">Trading Rules</button></div>
  ${notesTab==="notes" ? `
    <div class="toolbar"><div class="search-box">${icon("search",15)}<input id="notesSearchInput" placeholder="Search notes, tags..." value="${esc(notesSearch)}"/></div></div>
    ${sorted.length===0?`<div class="card">${emptyState("sticky-note","No notes yet")}</div>`:
    `<div class="notes-grid">${sorted.map(n=>`<div class="note-card"><div class="note-card-top"><strong>${esc(n.title)}</strong><span class="note-date">${fmtDate(n.date)}</span></div><p>${esc(n.content)}</p>
      <div class="note-card-footer"><span class="badge badge-neutral">${n.mood}</span>${(n.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}
      <div class="row-actions" style="margin-left:auto;"><button class="icon-btn-xs" data-edit-note="${n.id}">${icon("pencil",14)}</button><button class="icon-btn-xs" data-del-note="${n.id}">${icon("trash-2",14,"#ef4444")}</button></div></div></div>`).join("")}</div>`}
  ` : `
    <div class="card"><div class="card-header-row">${sectionTitle("shield","My Trading Rules")}<span class="badge ${rulesFollowed>=80?'badge-green':rulesFollowed>=50?'badge-yellow':'badge-red'}">${fmtPct(rulesFollowed)} followed</span></div>
    <div class="rules-list">${rules.map(r=>`<label class="rule-row"><span>${esc(r.text)}</span><input type="checkbox" data-toggle-rule="${r.id}" ${r.checked?'checked':''}/></label>`).join("")}</div>
    <p class="page-sub" style="margin-top:10px;">Edit your rule set from Settings → Trading Rules.</p></div>
  `}`;
}

async function deleteNote(id){

function exportData(){

  const a = document.createElement("a");
  a.href = url; a.download = "trading-performance-hub-"+new Date().toISOString().slice(0,10)+".json";

  toast("Data exported.");
}

function openSchoolItemModal(){
 const html=`<label class="field"><span class="field-label">Title</span><input id="schoolTitle" placeholder="e.g. Market Structure Course"/></label><label class="field"><span class="field-label">Resource Type</span><select id="schoolType"><option value="youtube">YouTube video / course</option><option value="pdf">PDF / document URL</option><option value="image">Image URL</option><option value="link">Website / other link</option></select></label><label class="field"><span class="field-label">URL</span><input id="schoolUrl" type="url" placeholder="https://..."/></label><label class="field"><span class="field-label">Description (optional)</span><textarea id="schoolDescription" rows="2"></textarea></label><div class="modal-footer"><button class="btn btn-ghost" id="schoolCancel">Cancel</button><button class="btn btn-primary" id="schoolSave">Save Resource</button></div>`;
 openModal("Add Learning Resource",html,{onMount:(w)=>{
   w.querySelector("#schoolCancel").addEventListener("click",closeModal);
   w.querySelector("#schoolSave").addEventListener("click",()=>{
     const title=w.querySelector("#schoolTitle").value.trim();

function importData(file){

    catch(e){ toast("Invalid JSON file.","danger"); }

}

}

function applyLanguage(){
 document.documentElement.lang=uiLanguage;document.body.classList.toggle("rtl-mode",uiLanguage==="ar");document.documentElement.dir=uiLanguage==="ar"?"rtl":"ltr";
 const btn=document.getElementById("languageToggle");if(btn)btn.textContent=uiLanguage==="ar"?"English":"العربية";
 if(uiLanguage!=="ar")return;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{const raw=n.nodeValue;const trimmed=raw.trim();if(AR[trimmed])n.nodeValue=raw.replace(trimmed,AR[trimmed]);});
 document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{if(AR[el.placeholder])el.placeholder=AR[el.placeholder];});
 document.querySelectorAll("[title]").forEach(el=>{if(AR[el.title])el.title=AR[el.title];});
}
const langBtn=document.getElementById("languageToggle");if(langBtn)langBtn.addEventListener("click",()=>{uiLanguage=uiLanguage==="en"?"ar":"en";localStorage.setItem("tph_ui_language",uiLanguage);renderAll();applyLanguage();});
const languageObserver=new MutationObserver(()=>{if(uiLanguage==="ar")applyLanguage();});languageObserver.observe(document.getElementById("content"),{childList:true,subtree:true});

/* ============================================================
   BOOT
   ============================================================ */
renderAll();

})();
</script>
